<!-- Manifest only, deliberately no service worker: a hand-maintained precache
     list on a no-build static host strands users on a stale bundle. -->
<link rel="manifest" href="manifest.webmanifest" />
<!-- Theme before first paint, so neither theme flashes the other:
     ?theme=gold|color (review links; not stored) > carino-theme cookie
     (shared across *.carino.systems) > localStorage > Gold & Black. -->
<meta name="theme-color" content="#050505" id="carinoThemeColor">
<script>
(function () {
  var d = document.documentElement, t = null;
  function pick(v) { return v === 'gold' ? 'gold' : (v === 'color' || v === 'colour') ? 'color' : null; }
  try { t = pick(new URLSearchParams(location.search).get('theme')); } catch (e) {}
  if (!t) { try { var m = document.cookie.match(/(?:^|;\s*)carino-theme=([^;]*)/); if (m) t = pick(decodeURIComponent(m[1])); } catch (e) {} }
  if (!t) { try { t = pick(localStorage.getItem('carino-theme')); } catch (e) {} }
  t = t || 'gold';
  d.setAttribute('data-carino-theme', t);
  var dark = d.getAttribute('data-theme') !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  var meta = document.getElementById('carinoThemeColor');
  if (meta) meta.content = t === 'gold' ? '#050505' : (dark ? '#0e1420' : '#eef3fc');
})();
</script>
<link rel="stylesheet" href="fonts/carino-fonts.css" />
<link rel="stylesheet" href="carino-ui.css" />
<link rel="stylesheet" href="css/jellyfish.css" />
<!-- Colourful theme + the switch; nothing applies until data-carino-theme="color". -->
<link rel="stylesheet" href="carino-theme.css" />
<style>
/* Colourful: the navbar and its buttons follow the theme; the sea does not.
   #sea is the stage (one WebGL canvas, "blue only"), so it keeps the black
   ground and the night inks its hint line, poster and dev readout read. The
   seam that carried the black nav ground into the water has no black nav to
   carry here, so a light bar simply meets the water. */
:root[data-carino-theme="color"] #sea{--bg:#050505;--text:#e5e5e5;--text-sec:#a3a3a3;--text-muted:#8a8a8a;--border:#262626;
  color-scheme:dark;background:#050505;color:var(--text);}
:root[data-carino-theme="color"] #sea::before{background:none;}
</style>
</head>
<body class="play-body">
  <!-- The stage is one canvas. The only controls are the three framings and a
       pause, carried into the navbar through [data-carino-actions] so a phone
       (which has no 1/2/3 keys) can reach them; the keys still work as before.
       The navbar is injected as the first child of <body> in normal flow, so
       body.play-body (a 100% flex column) leaves #sea the remainder: never
       padding-top:60px, never top:60px. With data-immersive it slides away in
       fullscreen or when idle, and #sea's ResizeObserver takes the new height.

       js/main.js still appends one transient <p> to #sea for the first 8.7 s of
       a session, naming the keys, and then removes it (SPEC §9 amendment 2). -->
  <div class="jf-actions" data-carino-actions>
    <div class="jf-seg" role="group" aria-label="View" data-priority="1">
      <button type="button" class="cs-btn" data-mode="tank" aria-pressed="true" data-i18n>Tank</button>
      <button type="button" class="cs-btn" data-mode="free" aria-pressed="false" data-i18n>Alongside</button>
      <button type="button" class="cs-btn" data-mode="close" aria-pressed="false" data-i18n>Close up</button>
    </div>
    <button type="button" class="cs-btn" id="jfPause" aria-pressed="false" data-priority="2">Pause</button>
  </div>

  <main id="sea" class="play-stage"><canvas id="gl"></canvas></main>

  <!-- js/main.js first, then the navbar: a module and a deferred classic script
       both run after parsing, in document order, so the renderer has claimed the
       canvas and armed its ResizeObserver before the navbar inserts itself and
       takes 61px off #sea. The observer sees that as an ordinary resize. -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/controls.js"></script>
  <script src="carino-navbar.js" data-app="Jellyfish" data-repo="Jellyfish" data-immersive defer></script>
  <script src="carino-theme.js" data-mark="logo.svg" data-mark-color="logo-color.svg" defer></script>
  <script src="carino-lang.js" defer></script>
  <script src="i18n.js" defer></script>
</body>
</html>
